name: Update Playlist Every Hour

on:
  schedule:
    # Har soatda 0 minutda ishlaydi (UTC vaqti)
    - cron: '0 * * * *'
  workflow_dispatch:  # Manual ishlash uchun tugma

jobs:
  update_playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run playlist generator
        run: python generate_playlist.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u8
          git commit -m "Playlist yangilandi: $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
